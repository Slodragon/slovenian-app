<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slovenko — Learn Slovenian</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- PROFILE PICKER SCREEN -->
  <section id="screen-profiles" class="screen">
    <div class="profile-picker">
      <div class="brand big-brand">🐿️ Sloven<span>ko</span></div>
      <h1>Who's learning?</h1>
      <div id="profile-list"></div>
      <div id="profile-create" class="hidden">
        <input id="profile-name" class="text-input" type="text" maxlength="16" placeholder="Your name" autocomplete="off">
        <div class="avatar-row" id="avatar-row"></div>
        <button id="btn-create-profile" class="btn primary big">START LEARNING</button>
      </div>
      <button id="btn-add-profile" class="btn ghost big">+ Add a learner</button>
      <div id="cloud-box">
        <button id="btn-cloud" class="btn ghost big">☁️ Sign in to sync across devices</button>
        <div id="cloud-form" class="hidden">
          <input id="cloud-email" class="text-input" type="email" placeholder="Email" autocomplete="off">
          <input id="cloud-pass" class="text-input" type="password" placeholder="Password (min 6 chars)">
          <button id="btn-signin" class="btn primary big">SIGN IN</button>
          <button id="btn-signup" class="btn ghost big">CREATE ACCOUNT</button>
          <p id="cloud-msg" class="cloud-msg"></p>
        </div>
        <div id="cloud-user" class="hidden cloud-user">
          ☁️ Synced as <b id="cloud-email-label"></b>
          <button id="btn-signout" class="link-btn">Sign out</button>
        </div>
      </div>
    </div>
  </section>

  <!-- HOME SCREEN -->
  <section id="screen-home" class="screen">
    <header class="topbar">
      <div class="brand">🐿️ Sloven<span>ko</span></div>
      <div class="stats">
        <button id="btn-switch-profile" class="profile-chip" title="Switch learner">
          <span id="profile-chip-avatar">🐿️</span> <b id="profile-chip-name">Learner</b> ▾
        </button>
        <div class="stat streak" title="Streak">🔥 <b id="stat-streak">0</b></div>
        <div class="stat xp" title="XP">⚡ <b id="stat-xp">0</b></div>
      </div>
    </header>
    <div id="units"></div>
  </section>

  <!-- LESSON SCREEN -->
  <section id="screen-lesson" class="screen">
    <header class="lessonbar">
      <button id="btn-quit" class="icon-btn" title="Quit lesson">✕</button>
      <div class="progress"><div id="progress-fill"></div></div>
      <div class="stat hearts" title="Hearts">❤️ <b id="stat-hearts">5</b></div>
    </header>
    <div class="lesson-head">
      <h2 id="lesson-title"></h2>
      <p id="lesson-tip"></p>
    </div>
    <div id="exercise-area"></div>
    <footer id="lesson-footer" class="lesson-footer hidden">
      <div id="feedback"></div>
      <button id="btn-check" class="btn primary">CHECK</button>
    </footer>
  </section>

  <!-- LESSON COMPLETE SCREEN -->
  <section id="screen-complete" class="screen">
    <div class="complete-card">
      <div class="complete-emoji">🏆</div>
      <h1>Lesson complete!</h1>
      <p id="complete-sub"></p>
      <div class="complete-stats">
        <div class="cstat xp-bg"><span>TOTAL XP</span><b id="complete-xp">0</b></div>
        <div class="cstat acc-bg"><span>ACCURACY</span><b id="complete-acc">0%</b></div>
      </div>
      <button id="btn-continue" class="btn primary big">CONTINUE</button>
    </div>
  </section>

  <!-- RESULT MODAL -->
  <div id="modal-result" class="modal hidden">
    <div id="modal-body" class="modal-body"></div>
    <button id="btn-modal-next" class="btn primary big">CONTINUE</button>
  </div>

  <!-- LESSON FAILED MODAL -->
  <div id="modal-failed" class="modal hidden">
    <div class="modal-body failed">
      <div class="complete-emoji">💔</div>
      <h1>Out of hearts!</h1>
      <p>Don't worry — practice makes perfect.</p>
      <button id="btn-retry" class="btn primary big">TRY AGAIN</button>
      <button id="btn-exit" class="btn ghost big">EXIT</button>
    </div>
  </div>

</div>
<script src="lessons.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-app.js"></script>
<script src="app.js"></script>
</body>
</html>
