<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slovenko — Learn Slovenian</title>
<style>
:root {
  --green: #58cc02;
  --green-dark: #46a302;
  --blue: #1cb0f6;
  --purple: #ce82ff;
  --orange: #ff9600;
  --red: #ff4b4b;
  --ink: #3c3c3c;
  --muted: #afafaf;
  --bg: #ffffff;
  --card: #f7f7f7;
  --border: #e5e5e5;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

#app { max-width: 640px; margin: 0 auto; min-height: 100vh; }

.screen { display: none; min-height: 100vh; padding-bottom: 120px; }
.screen.active { display: block; }

/* ---------- Top bar ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; position: sticky; top: 0; background: #fff; z-index: 5;
  border-bottom: 2px solid var(--border);
}
.brand { font-size: 26px; font-weight: 900; color: var(--green); letter-spacing: -0.5px; }
.brand span { color: var(--ink); }
.stats { display: flex; gap: 18px; }
.stat { font-size: 17px; font-weight: 800; }
.stat.xp { color: var(--orange); }
.stat.streak { color: var(--orange); }
.stat.hearts { color: var(--red); }

/* ---------- Home / units ---------- */
.unit { padding: 8px 20px 24px; }
.unit-header {
  display: flex; align-items: center; gap: 14px;
  border-radius: 16px; padding: 16px 18px; color: #fff; margin: 18px 0 8px;
}
.unit-header .uicon { font-size: 30px; }
.unit-header h2 { font-size: 20px; font-weight: 900; }
.unit-header p { font-size: 13px; opacity: 0.92; font-weight: 700; }

.path { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 0 8px; }
.node-wrap { display: flex; flex-direction: column; align-items: center; }
.lesson-node {
  width: 74px; height: 74px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; cursor: pointer; border: none;
  border-bottom: 6px solid rgba(0,0,0,0.15);
  transition: transform 0.08s ease;
  color: #fff;
}
.lesson-node:active { transform: scale(0.94); }
.lesson-node.locked { background: #e5e5e5 !important; color: #c9c9c9; cursor: not-allowed; border-bottom-color: #d0d0d0; }
.lesson-node.done { background: #ffd900 !important; color: #fff; border-bottom-color: #d4ae00; }
.node-label {
  margin-top: 6px; background: #fff; border: 2px solid var(--border);
  padding: 5px 14px; border-radius: 12px; font-weight: 800; font-size: 13px;
  text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink);
}
.tip-box {
  margin: 14px 4px 0; background: var(--card); border: 2px solid var(--border);
  border-radius: 14px; padding: 12px 16px; font-size: 14px; color: #777; font-weight: 600;
}
.tip-box b { color: var(--ink); }

/* ---------- Lesson screen ---------- */
.lessonbar { display: flex; align-items: center; gap: 14px; padding: 16px 20px; }
.icon-btn {
  border: none; background: none; font-size: 20px; font-weight: 900; color: var(--muted);
  cursor: pointer; padding: 4px 8px;
}
.icon-btn:hover { color: var(--ink); }
.progress { flex: 1; height: 16px; background: var(--border); border-radius: 10px; overflow: hidden; }
#progress-fill { height: 100%; width: 0%; background: var(--green); border-radius: 10px; transition: width 0.3s ease; }

.lesson-head { padding: 4px 24px 12px; }
.lesson-head h2 { font-size: 24px; font-weight: 900; }
.lesson-head p { color: var(--muted); font-weight: 700; font-size: 14px; margin-top: 2px; }

#exercise-area { padding: 8px 24px; }
.ex-prompt { font-size: 22px; font-weight: 800; margin: 10px 0 20px; }
.ex-prompt .dir-tag {
  display: inline-block; font-size: 11px; font-weight: 900; color: var(--muted);
  border: 2px solid var(--border); border-radius: 8px; padding: 2px 8px;
  margin-right: 10px; vertical-align: middle; text-transform: uppercase; letter-spacing: 1px;
}
.ex-hint { color: var(--muted); font-weight: 700; margin-top: -12px; margin-bottom: 16px; font-size: 14px; }

.options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .options { grid-template-columns: 1fr; } }
.opt-btn {
  border: 2px solid var(--border); background: #fff; border-radius: 14px;
  padding: 16px; font-size: 17px; font-weight: 800; font-family: inherit; color: var(--ink);
  cursor: pointer; border-bottom-width: 4px; text-align: left;
}
.opt-btn:hover:not(:disabled) { background: #f0faff; border-color: #b3e5fc; }
.opt-btn.selected { border-color: var(--blue); background: #e5f6ff; }
.opt-btn.correct { border-color: var(--green); background: #e9fad9; color: var(--green-dark); }
.opt-btn.wrong { border-color: var(--red); background: #ffe5e5; color: var(--red); }
.opt-btn:disabled { cursor: default; }

.fill-sentence { font-size: 24px; font-weight: 800; margin: 10px 0 20px; }
.fill-sentence .blank {
  display: inline-block; min-width: 90px; border-bottom: 3px solid var(--ink);
  text-align: center; color: var(--blue); padding: 0 6px;
}

.wordbank { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.answer-area {
  min-height: 60px; border-bottom: 3px dashed var(--muted); display: flex; flex-wrap: wrap;
  gap: 10px; padding: 10px 2px; margin-bottom: 8px;
}
.word-chip {
  border: 2px solid var(--border); background: #fff; border-bottom-width: 4px; border-radius: 12px;
  padding: 10px 16px; font-size: 17px; font-weight: 800; font-family: inherit; cursor: pointer;
}
.word-chip:hover { background: #f4f4f4; }
.word-chip.used { visibility: hidden; }
.word-chip.in-answer { background: #e5f6ff; border-color: #b3e5fc; }

.listen-row { display: flex; align-items: center; gap: 16px; margin: 10px 0 20px; }
.speaker-btn {
  width: 72px; height: 72px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--blue); color: #fff; font-size: 30px; border-bottom: 5px solid #1899d6;
}
.speaker-btn:active { transform: translateY(2px); border-bottom-width: 3px; }
.text-input {
  flex: 1; border: 2px solid var(--border); background: var(--card); border-radius: 14px;
  padding: 14px 16px; font-size: 18px; font-weight: 700; font-family: inherit; color: var(--ink);
}
.text-input:focus { outline: none; border-color: var(--blue); background: #fff; }

.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-btn {
  border: 2px solid var(--border); background: #fff; border-radius: 14px; border-bottom-width: 4px;
  padding: 14px; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;
}
.match-btn.selected { border-color: var(--blue); background: #e5f6ff; }
.match-btn.matched { border-color: var(--green); background: #e9fad9; color: var(--green-dark); cursor: default; opacity: 0.55; }

/* ---------- Footer ---------- */
.lesson-footer {
  position: fixed; bottom: 0; left: 0; right: 0; max-width: 640px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px 24px; background: #fff; border-top: 2px solid var(--border); gap: 14px;
}
.lesson-footer.hidden { display: none; }
#feedback { font-weight: 900; font-size: 17px; }
#feedback.good { color: var(--green-dark); }
#feedback.bad { color: var(--red); }

.btn {
  border: none; border-radius: 14px; padding: 14px 28px; font-size: 16px; font-weight: 900;
  font-family: inherit; cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
}
.btn.primary { background: var(--green); color: #fff; border-bottom: 4px solid var(--green-dark); }
.btn.primary:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn.primary:disabled { background: #e5e5e5; border-bottom-color: #d0d0d0; color: var(--muted); cursor: not-allowed; }
.btn.big { width: 100%; padding: 16px; font-size: 17px; }
.btn.ghost { background: none; color: var(--blue); border: 2px solid var(--border); border-bottom-width: 4px; margin-top: 10px; }

/* ---------- Complete screen ---------- */
#screen-complete { display: none; }
#screen-complete.active { display: flex; align-items: center; justify-content: center; }
.complete-card { text-align: center; padding: 30px; width: 100%; max-width: 420px; }
.complete-emoji { font-size: 72px; margin-bottom: 10px; }
.complete-card h1 { font-size: 30px; font-weight: 900; color: #ffb800; margin-bottom: 6px; }
.complete-card p { color: var(--muted); font-weight: 700; margin-bottom: 24px; }
.complete-stats { display: flex; gap: 14px; margin-bottom: 28px; }
.cstat { flex: 1; border-radius: 16px; padding: 16px; color: #fff; }
.cstat span { display: block; font-size: 12px; font-weight: 900; letter-spacing: 1px; opacity: 0.9; }
.cstat b { font-size: 24px; font-weight: 900; }
.xp-bg { background: var(--orange); }
.acc-bg { background: var(--blue); }

/* ---------- Profile picker ---------- */
.profile-picker { max-width: 420px; margin: 0 auto; padding: 48px 24px; text-align: center; }
.big-brand { font-size: 34px; margin-bottom: 8px; }
.profile-picker h1 { font-size: 26px; font-weight: 900; margin-bottom: 24px; }
#profile-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.profile-card {
  display: flex; align-items: center; gap: 14px; text-align: left;
  border: 2px solid var(--border); border-bottom-width: 4px; border-radius: 16px;
  padding: 14px 16px; cursor: pointer; background: #fff; position: relative;
}
.profile-card:hover { background: #f0faff; border-color: #b3e5fc; }
.profile-avatar { font-size: 34px; }
.profile-info { flex: 1; display: flex; flex-direction: column; }
.profile-info b { font-size: 18px; font-weight: 900; }
.profile-info span { color: var(--muted); font-weight: 700; font-size: 14px; }
.profile-del { border: none; background: none; color: var(--muted); font-weight: 900; cursor: pointer; font-size: 14px; padding: 6px; }
.profile-del:hover { color: var(--red); }
#profile-create { margin-bottom: 14px; display: flex; flex-direction: column; gap: 14px; }
#profile-create.hidden { display: none; }
.avatar-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.avatar-opt {
  font-size: 26px; width: 52px; height: 52px; border-radius: 14px; cursor: pointer;
  border: 2px solid var(--border); background: #fff;
}
.avatar-opt.selected { border-color: var(--green); background: #e9fad9; }
.profile-chip {
  display: flex; align-items: center; gap: 6px; border: 2px solid var(--border);
  background: #fff; border-radius: 12px; padding: 6px 12px; font-size: 14px;
  font-family: inherit; font-weight: 800; color: var(--ink); cursor: pointer;
}
.profile-chip:hover { background: var(--card); }
.profile-card .cloud-badge { font-size: 14px; }

/* ---------- Cloud sync box ---------- */
#cloud-box { margin-top: 22px; border-top: 2px solid var(--border); padding-top: 18px; display: flex; flex-direction: column; gap: 10px; }
#cloud-form { display: flex; flex-direction: column; gap: 10px; }
#cloud-form.hidden, #cloud-user.hidden, #btn-cloud.hidden { display: none; }
.cloud-msg { color: var(--red); font-weight: 700; font-size: 14px; min-height: 18px; }
.cloud-note { color: var(--muted); font-weight: 600; font-size: 14px; }
.cloud-note code { background: var(--card); padding: 2px 6px; border-radius: 6px; }
.cloud-user { font-weight: 700; color: var(--ink); font-size: 15px; }
.link-btn { border: none; background: none; color: var(--blue); font-weight: 800; cursor: pointer; font-family: inherit; font-size: 14px; }

/* ---------- Modals ---------- */
.modal {
  position: fixed; inset: 0; background: rgba(255,255,255,0.96); z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding: 24px; gap: 18px; padding-bottom: 40px;
}
.modal.hidden { display: none; }
.modal-body { width: 100%; max-width: 480px; text-align: center; }
.modal-body h1 { font-size: 26px; font-weight: 900; margin-bottom: 6px; }
.modal-body.good h1 { color: var(--green-dark); }
.modal-body.bad h1 { color: var(--red); }
.modal-body .correct-answer { color: var(--muted); font-weight: 700; margin-top: 8px; font-size: 16px; }
.modal-body .correct-answer b { color: var(--green-dark); }
.modal-body.failed h1 { color: var(--orange); }
.modal-body p { color: var(--muted); font-weight: 700; }

</style>
</head>
<body>
<div id="app">

  <!-- PROFILE PICKER SCREEN -->
  <section id="screen-profiles" class="screen">
    <div class="profile-picker">
      <div class="brand big-brand">🐿️ Sloven<span>ko</span></div>
      <h1>Who's learning?</h1>
      <div id="profile-list"></div>
      <div id="profile-create" class="hidden">
        <input id="profile-name" class="text-input" type="text" maxlength="16" placeholder="Your name" autocomplete="off">
        <div class="avatar-row" id="avatar-row"></div>
        <button id="btn-create-profile" class="btn primary big">START LEARNING</button>
      </div>
      <button id="btn-add-profile" class="btn ghost big">+ Add a learner</button>
      <div id="cloud-box">
        <button id="btn-cloud" class="btn ghost big">☁️ Sign in to sync across devices</button>
        <div id="cloud-form" class="hidden">
          <input id="cloud-email" class="text-input" type="email" placeholder="Email" autocomplete="off">
          <input id="cloud-pass" class="text-input" type="password" placeholder="Password (min 6 chars)">
          <button id="btn-signin" class="btn primary big">SIGN IN</button>
          <button id="btn-signup" class="btn ghost big">CREATE ACCOUNT</button>
          <p id="cloud-msg" class="cloud-msg"></p>
        </div>
        <div id="cloud-user" class="hidden cloud-user">
          ☁️ Synced as <b id="cloud-email-label"></b>
          <button id="btn-signout" class="link-btn">Sign out</button>
        </div>
      </div>
    </div>
  </section>

  <!-- HOME SCREEN -->
  <section id="screen-home" class="screen">
    <header class="topbar">
      <div class="brand">🐿️ Sloven<span>ko</span></div>
      <div class="stats">
        <button id="btn-switch-profile" class="profile-chip" title="Switch learner">
          <span id="profile-chip-avatar">🐿️</span> <b id="profile-chip-name">Learner</b> ▾
        </button>
        <div class="stat streak" title="Streak">🔥 <b id="stat-streak">0</b></div>
        <div class="stat xp" title="XP">⚡ <b id="stat-xp">0</b></div>
      </div>
    </header>
    <div id="units"></div>
  </section>

  <!-- LESSON SCREEN -->
  <section id="screen-lesson" class="screen">
    <header class="lessonbar">
      <button id="btn-quit" class="icon-btn" title="Quit lesson">✕</button>
      <div class="progress"><div id="progress-fill"></div></div>
      <div class="stat hearts" title="Hearts">❤️ <b id="stat-hearts">5</b></div>
    </header>
    <div class="lesson-head">
      <h2 id="lesson-title"></h2>
      <p id="lesson-tip"></p>
    </div>
    <div id="exercise-area"></div>
    <footer id="lesson-footer" class="lesson-footer hidden">
      <div id="feedback"></div>
      <button id="btn-check" class="btn primary">CHECK</button>
    </footer>
  </section>

  <!-- LESSON COMPLETE SCREEN -->
  <section id="screen-complete" class="screen">
    <div class="complete-card">
      <div class="complete-emoji">🏆</div>
      <h1>Lesson complete!</h1>
      <p id="complete-sub"></p>
      <div class="complete-stats">
        <div class="cstat xp-bg"><span>TOTAL XP</span><b id="complete-xp">0</b></div>
        <div class="cstat acc-bg"><span>ACCURACY</span><b id="complete-acc">0%</b></div>
      </div>
      <button id="btn-continue" class="btn primary big">CONTINUE</button>
    </div>
  </section>

  <!-- RESULT MODAL -->
  <div id="modal-result" class="modal hidden">
    <div id="modal-body" class="modal-body"></div>
    <button id="btn-modal-next" class="btn primary big">CONTINUE</button>
  </div>

  <!-- LESSON FAILED MODAL -->
  <div id="modal-failed" class="modal hidden">
    <div class="modal-body failed">
      <div class="complete-emoji">💔</div>
      <h1>Out of hearts!</h1>
      <p>Don't worry — practice makes perfect.</p>
      <button id="btn-retry" class="btn primary big">TRY AGAIN</button>
      <button id="btn-exit" class="btn ghost big">EXIT</button>
    </div>
  </div>

</div>
<script>
/* Slovenian course content for Slovenko */

const UNITS = [
  {
    id: "u1",
    title: "Unit 1 · Basics",
    description: "Say hello and survive your first day",
    color: "#58cc02",
    tip: "Slovenian has informal (ti) and formal (vam) forms. Start with the friendly ti-form.",
    lessons: [
      {
        id: "u1l1",
        title: "Greetings",
        exercises: [
          { type: "choice", dir: "en-sl", prompt: "Hello!", options: ["Živjo", "Adijo", "Hvala", "Prosim"], answer: "Živjo" },
          { type: "choice", dir: "sl-en", prompt: "Dobro jutro", options: ["Good morning", "Good night", "Goodbye", "Good evening"], answer: "Good morning" },
          { type: "choice", dir: "en-sl", prompt: "Goodbye", options: ["Prosim", "Živjo", "Adijo", "Hvala"], answer: "Adijo" },
          { type: "choice", dir: "sl-en", prompt: "Hvala", options: ["Please", "Thank you", "Yes", "Sorry"], answer: "Thank you" },
          { type: "choice", dir: "en-sl", prompt: "Please", options: ["Hvala", "Prosim", "Ne", "Da"], answer: "Prosim" },
          { type: "words", dir: "en-sl", prompt: "Good evening", bank: ["jutro", "Dober", "večer", "noč"], answer: "Dober večer" },
          { type: "listen", prompt: "Type what you hear", answer: "Lahko noč", hint: "Good night" }
        ]
      },
      {
        id: "u1l2",
        title: "Yes, no, sorry",
        exercises: [
          { type: "choice", dir: "en-sl", prompt: "Yes", options: ["Ne", "Mogoče", "Da", "Prosim"], answer: "Da" },
          { type: "choice", dir: "sl-en", prompt: "Ne", options: ["Yes", "No", "Maybe", "Please"], answer: "No" },
          { type: "choice", dir: "en-sl", prompt: "Sorry", options: ["Hvala", "Prosim", "Živjo", "Oprosti"], answer: "Oprosti" },
          { type: "choice", dir: "sl-en", prompt: "Oprosti", options: ["Sorry", "Thank you", "Hello", "Bye"], answer: "Sorry" },
          { type: "fill", sentence: "Dobro ___", gloss: "I am fine — fill in the verb", options: ["sem", "si", "je", "smo"], answer: "sem" },
          { type: "choice", dir: "en-sl", prompt: "I don't understand", options: ["Ne razumem", "Razumem", "Govorim", "Vidim"], answer: "Ne razumem" },
          { type: "words", dir: "sl-en", prompt: "Ne razumem", bank: ["Ne", "razumem", "vidim", "slišim"], answer: "Ne razumem" },
          { type: "listen", prompt: "Type what you hear", answer: "Hvala lepa", hint: "Thank you very much" }
        ]
      },
      {
        id: "u1l3",
        title: "Introductions",
        exercises: [
          { type: "choice", dir: "en-sl", prompt: "How are you? (to a friend)", options: ["Kako si?", "Kako ste?", "Kako vam je ime?", "Kje si?"], answer: "Kako si?" },
          { type: "choice", dir: "sl-en", prompt: "Kako si?", options: ["How are you?", "Where are you?", "What's your name?", "How old are you?"], answer: "How are you?" },
          { type: "choice", dir: "en-sl", prompt: "I am fine", options: ["Dobro sem", "Slabo sem", "Tu sem", "Hvala"], answer: "Dobro sem" },
          { type: "choice", dir: "sl-en", prompt: "Dobro sem", options: ["I am fine", "I am bad", "Thank you", "Excuse me"], answer: "I am fine" },
          { type: "choice", dir: "en-sl", prompt: "What's your name?", options: ["Kako ti je ime?", "Koliko si star?", "Kje živiš?", "Kako si?"], answer: "Kako ti je ime?" },
          { type: "fill", sentence: "Jaz ___ Ana.", gloss: "I am Ana", options: ["sem", "si", "je", "sva"], answer: "sem" },
          { type: "words", dir: "en-sl", prompt: "What's your name? (formal)", bank: ["Kako", "vam", "je", "ime", "si"], answer: "Kako vam je ime" },
          { type: "choice", dir: "en-sl", prompt: "Nice to meet you", options: ["Me veseli", "Adijo", "Na svidenje", "Prosim"], answer: "Me veseli" }
        ]
      }
    ]
  },
  {
    id: "u2",
    title: "Unit 2 · Food & drink",
    description: "Order food and drinks like a local",
    color: "#1cb0f6",
    tip: "Slovenian nouns have genders: masculine (kruh), feminine (voda), neuter (jabolko).",
    lessons: [
      {
        id: "u2l1",
        title: "Food basics",
        exercises: [
          { type: "choice", dir: "en-sl", prompt: "bread", options: ["voda", "kruh", "mleko", "sir"], answer: "kruh" },
          { type: "choice", dir: "sl-en", prompt: "Kruh", options: ["Milk", "Bread", "Cheese", "Water"], answer: "Bread" },
          { type: "choice", dir: "en-sl", prompt: "water", options: ["pivo", "voda", "kava", "sok"], answer: "voda" },
          { type: "choice", dir: "en-sl", prompt: "apple", options: ["hruška", "jabolko", "banana", "pomaranča"], answer: "jabolko" },
          { type: "choice", dir: "sl-en", prompt: "Jabolko", options: ["Pear", "Apple", "Banana", "Orange"], answer: "Apple" },
          { type: "choice", dir: "en-sl", prompt: "I eat bread", options: ["Pijem vodo", "Jem kruh", "Ješ jabolko", "Je kruh"], answer: "Jem kruh" },
          { type: "fill", sentence: "___ je voda.", gloss: "This is water", options: ["To", "Ti", "Jaz", "On"], answer: "To" },
          { type: "listen", prompt: "Type what you hear", answer: "Jabolko, prosim", hint: "An apple, please" }
        ]
      },
      {
        id: "u2l2",
        title: "Drinks & ordering",
        exercises: [

<script>
/* Slovenko — optional Firebase cloud sync.
   If firebase-config.js is missing, the app simply runs in offline/local mode. */

const FIREBASE_CDN = "https://www.gstatic.com/firebasejs/10.12.2/";

const fb = { app: null, auth: null, db: null, user: null, ready: false };

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function initFirebase() {
  if (typeof firebaseConfig === "undefined") return false;
  try {
    await loadScript(FIREBASE_CDN + "firebase-app-compat.js");
    await loadScript(FIREBASE_CDN + "firebase-auth-compat.js");
    await loadScript(FIREBASE_CDN + "firebase-firestore-compat.js");
    fb.app = firebase.initializeApp(firebaseConfig);
    fb.auth = firebase.auth();
    fb.db = firebase.firestore();
    fb.ready = true;
    fb.auth.onAuthStateChanged(onAuthChange);
    return true;
  } catch (e) {
    console.warn("Firebase unavailable — running in offline mode.");
    return false;
  }
}

async function onAuthChange(user) {
  fb.user = user;
  if (user) {
    try {
      const snap = await fb.db.collection("users").doc(user.uid).get();
      if (snap.exists) {
        const d = snap.data();
        const p = store.profiles.find(x => x.uid === user.uid) || emptyProfile(d.name || "Learner", d.avatar || AVATARS[0]);
        Object.assign(p, {
          uid: user.uid, name: d.name || p.name, avatar: d.avatar || p.avatar,
          xp: d.xp || 0, streak: d.streak || 0, lastDate: d.lastDate || null,
          completed: d.completed || {}
        });
        if (!store.profiles.includes(p)) store.profiles.push(p);
        if (state && state.uid !== user.uid && (state.xp > (d.xp || 0) || Object.keys(state.completed).length > Object.keys(d.completed || {}).length)) {
          // Local profile has more progress than the cloud copy: upload it.
          p.xp = Math.max(p.xp, state.xp);
          p.completed = Object.assign({}, d.completed, state.completed);
          p.streak = Math.max(p.streak, state.streak);
          await syncCloud(p);
        }
        activateProfile(p.id);
        renderHome();
        showScreen("screen-home");
      } else if (state) {
        // No cloud doc yet: claim the current local profile for this account.
        state.uid = user.uid;
        saveStore();
        await syncCloud(state);
      }
    } catch (e) {
      console.warn("Cloud sync failed:", e.message);
    }
  }
  renderCloudBox();
}

async function syncCloud(profile) {
  if (!fb.ready || !fb.user || !profile) return;
  try {
    await fb.db.collection("users").doc(fb.user.uid).set({
      name: profile.name, avatar: profile.avatar,
      xp: profile.xp, streak: profile.streak, lastDate: profile.lastDate,
      completed: profile.completed, updatedAt: Date.now()
    }, { merge: true });
  } catch (e) {
    console.warn("Cloud sync failed:", e.message);
  }
}

function renderCloudBox() {
  const box = document.getElementById("cloud-box");
  if (!box) return;
  const btn = document.getElementById("btn-cloud");
  const form = document.getElementById("cloud-form");
  const userBox = document.getElementById("cloud-user");
  const configured = typeof firebaseConfig !== "undefined";
  if (!configured) {
    box.innerHTML = `<p class="cloud-note">☁️ Cloud sync is off — add <code>firebase-config.js</code> to enable accounts across devices.</p>`;
    return;
  }
  if (fb.user) {
    btn.classList.add("hidden");
    form.classList.add("hidden");
    userBox.classList.remove("hidden");
    document.getElementById("cloud-email-label").textContent = fb.user.email;
  } else {
    btn.classList.remove("hidden");
    userBox.classList.add("hidden");
  }
}

async function cloudSignIn(email, password) {
  await fb.auth.signInWithEmailAndPassword(email, password);
}

async function cloudSignUp(email, password) {
  const cred = await fb.auth.createUserWithEmailAndPassword(email, password);
  return cred;
}

async function cloudSignOut() {
  await fb.auth.signOut();
  renderProfiles();
  showScreen("screen-profiles");
}

window.SlovenkoCloud = {
  sync() { if (state) syncCloud(state); },
  get signedIn() { return !!fb.user; }
};

document.addEventListener("DOMContentLoaded", () => {
  initFirebase().then(renderCloudBox);
  const btn = document.getElementById("btn-cloud");
  const form = document.getElementById("cloud-form");
  if (btn) btn.addEventListener("click", () => form.classList.toggle("hidden"));
  const msg = document.getElementById("cloud-msg");
  const doAuth = async (fn) => {
    const email = document.getElementById("cloud-email").value.trim();
    const pass = document.getElementById("cloud-pass").value;
    msg.textContent = "";
    if (!email || pass.length < 6) { msg.textContent = "Enter an email and a password (min 6 chars)."; return; }
    try { await fn(email, pass); }
    catch (e) { msg.textContent = e.message.replace("Firebase: ", ""); }
  };
  document.getElementById("btn-signin").addEventListener("click", () => doAuth(cloudSignIn));
  document.getElementById("btn-signup").addEventListener("click", () => doAuth(cloudSignUp));
  document.getElementById("btn-signout").addEventListener("click", cloudSignOut);
});

</script>
<script>
/* Slovenko — app logic (multi-profile) */

const STORE_KEY = "slovenko-profiles-v1";
const LEGACY_KEY = "slovenko-progress-v1";
const AVATARS = ["🐿️", "🐸", "🦊", "🐼", "🦁", "🐯", "🐰", "🐨"];

function emptyProfile(name, avatar) {
  return { id: "p" + Date.now() + Math.random().toString(36).slice(2, 7),
           name: name || "Learner", avatar: avatar || AVATARS[0],
           xp: 0, streak: 0, lastDate: null, completed: {} };
}

function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.profiles)) return Object.assign({ profiles: [], activeId: null }, s);
  } catch (e) { /* fresh start */ }
  // Migrate the old single-player save into a first profile.
  try {
    const old = JSON.parse(localStorage.getItem(LEGACY_KEY));
    if (old && typeof old === "object" && (old.xp || old.completed)) {
      const p = emptyProfile("Learner", AVATARS[0]);
      Object.assign(p, { xp: old.xp || 0, streak: old.streak || 0, lastDate: old.lastDate || null, completed: old.completed || {} });
      localStorage.removeItem(LEGACY_KEY);
      return { profiles: [p], activeId: p.id };
    }
  } catch (e) { /* ignore */ }
  return { profiles: [], activeId: null };
}

function saveStore() {
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

let store = loadStore();
let state = store.profiles.find(p => p.id === store.activeId) || null;

function activateProfile(id) {
  state = store.profiles.find(p => p.id === id) || null;
  store.activeId = id;
  saveStore();
  if (state) updateStreak();
}

// Streak: +1 if last activity was yesterday, reset if older, keep if today.
function updateStreak() {
  if (!state) return;
  const today = new Date().toDateString();
  if (state.lastDate === today) return;
  const y = new Date(Date.now() - 86400000).toDateString();
  state.streak = state.lastDate === y ? state.streak + 1 : 1;
  state.lastDate = today;
  saveStore();
  if (window.SlovenkoCloud) window.SlovenkoCloud.sync();
}

/* ---------------- Profile picker screen ---------------- */

function renderProfiles() {
  const list = document.getElementById("profile-list");
  list.innerHTML = "";
  store.profiles.forEach(p => {
    const card = document.createElement("div");
    card.className = "profile-card";
    card.innerHTML = `<div class="profile-avatar">${p.avatar}</div>
      <div class="profile-info"><b>${escapeHtml(p.name)} ${p.uid ? '<span class="cloud-badge">☁️</span>' : ""}</b><span>⚡ ${p.xp} XP · 🔥 ${p.streak}</span></div>
      <button class="profile-del" title="Delete profile">✕</button>`;
    card.querySelector(".profile-del").addEventListener("click", (e) => {
      e.stopPropagation();
      if (!confirm(`Delete ${p.name}'s profile and all progress?`)) return;
      store.profiles = store.profiles.filter(x => x.id !== p.id);
      if (store.activeId === p.id) { store.activeId = null; state = null; }
      saveStore();
      renderProfiles();
    });
    card.addEventListener("click", () => {
      activateProfile(p.id);
      renderHome();
      showScreen("screen-home");
    });
    list.appendChild(card);
  });
  document.getElementById("btn-add-profile").classList.toggle("hidden", false);
  document.getElementById("profile-create").classList.add("hidden");
  const avRow = document.getElementById("avatar-row");
  avRow.innerHTML = "";
  AVATARS.forEach((a, i) => {
    const b = document.createElement("button");
    b.className = "avatar-opt" + (i === 0 ? " selected" : "");
    b.textContent = a;
    b.addEventListener("click", () => {
      avRow.querySelectorAll(".avatar-opt").forEach(x => x.classList.remove("selected"));
      b.classList.add("selected");
    });
    avRow.appendChild(b);
  });
}

function createProfile() {
  const name = document.getElementById("profile-name").value.trim().slice(0, 16);
  const sel = document.querySelector("#avatar-row .avatar-opt.selected");
  const p = emptyProfile(name || "Learner", sel ? sel.textContent : AVATARS[0]);
  store.profiles.push(p);
  saveStore();
  activateProfile(p.id);
  document.getElementById("profile-name").value = "";
  renderHome();
  showScreen("screen-home");
}

/* ---------------- Home screen ---------------- */

function isUnlocked(lessonId) {
  const all = [];
  for (const u of UNITS) for (const l of u.lessons) all.push(l.id);
  const i = all.indexOf(lessonId);
  return i === 0 || !!(state && state.completed[all[i - 1]]);
}

function renderHome() {
  if (!state) { renderProfiles(); showScreen("screen-profiles"); return; }
  document.getElementById("stat-xp").textContent = state.xp;
  document.getElementById("stat-streak").textContent = state.streak;
  document.getElementById("profile-chip-avatar").textContent = state.avatar;
  document.getElementById("profile-chip-name").textContent = state.name;
  const wrap = document.getElementById("units");
  wrap.innerHTML = "";
  const icons = ["👋", "🍽️", "👨‍👩‍👧", "🗺️"];
  UNITS.forEach((u, ui) => {
    const sec = document.createElement("div");
    sec.className = "unit";
    sec.innerHTML = `
      <div class="unit-header" style="background:${u.color}">
        <div class="uicon">${icons[ui] || "📘"}</div>
        <div><h2>${u.title}</h2><p>${u.description}</p></div>
      </div>
      <div class="path"></div>
      <div class="tip-box"><b>Grammar tip:</b> ${u.tip}</div>`;
    const path = sec.querySelector(".path");
    u.lessons.forEach((l, li) => {
      const done = !!state.completed[l.id];
      const unlocked = isUnlocked(l.id);
      const nodeWrap = document.createElement("div");
      nodeWrap.className = "node-wrap";
      nodeWrap.style.transform = `translateX(${li % 2 === 0 ? -34 : 34}px)`;
      const btn = document.createElement("button");
      btn.className = "lesson-node" + (done ? " done" : "") + (!unlocked ? " locked" : "");
      btn.style.background = unlocked ? u.color : "";
      btn.textContent = done ? "★" : unlocked ? "▶" : "🔒";
      btn.title = l.title;
      if (unlocked) btn.addEventListener("click", () => startLesson(l.id));
      const label = document.createElement("div");
      label.className = "node-label";
      label.textContent = l.title;
      nodeWrap.appendChild(btn);
      nodeWrap.appendChild(label);
      path.appendChild(nodeWrap);
    });
    wrap.appendChild(sec);
  });
}

/* ---------------- Lesson engine ---------------- */

let session = null;

function startLesson(id) {
  const found = findLesson(id);
  if (!found || !state) return;
  session = {
    lesson: found.lesson, unit: found.unit,
    index: 0, hearts: 5, earned: 0, correct: 0, answered: 0,
    selection: null, words: [], typed: "", matched: new Set(), matchSel: null
  };
  document.getElementById("lesson-title").textContent = found.lesson.title;
  document.getElementById("lesson-tip").textContent = "";
  showScreen("screen-lesson");
  renderExercise();
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function normalize(s) {
  return (s || "").toLowerCase().trim().replace(/\s+/g, " ")
    .replace(/[.!?,;:]+$/g, "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "sl-SI";
    u.rate = 0.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) { /* speech not available */ }
}

function renderExercise() {
  const ex = session.lesson.exercises[session.index];
  const total = session.lesson.exercises.length;
  document.getElementById("progress-fill").style.width = (session.index / total * 100) + "%";
  document.getElementById("stat-hearts").textContent = session.hearts;
  document.getElementById("lesson-tip").textContent = `${session.index + 1} / ${total}`;

  session.selection = null; session.words = []; session.typed = "";
  session.matched = new Set(); session.matchSel = null;

  const area = document.getElementById("exercise-area");
  const footer = document.getElementById("lesson-footer");
  footer.classList.remove("hidden");
  document.getElementById("feedback").textContent = "";
  const btn = document.getElementById("btn-check");
  btn.disabled = true;
  btn.textContent = session.index === total - 1 ? "FINISH" : "CHECK";

  area.innerHTML = "";
  if (ex.type === "choice" || ex.type === "fill") renderChoice(area, ex);
  else if (ex.type === "words") renderWords(area, ex);
  else if (ex.type === "listen") renderListen(area, ex);
  else if (ex.type === "match") renderMatch(area, ex);
}

function dirTag(ex) {
  if (ex.dir === "en-sl") return '<span class="dir-tag">EN → SL</span>';
  if (ex.dir === "sl-en") return '<span class="dir-tag">SL → EN</span>';
  return "";
}

function renderChoice(area, ex) {
  let html = `<div class="ex-prompt">${dirTag(ex)}${ex.type === "fill" ? "" : escapeHtml(ex.prompt)}</div>`;
  if (ex.type === "fill") {
    const parts = ex.sentence.split("___");
    html = `<div class="fill-sentence">${escapeHtml(parts[0])}<span class="blank" id="fill-blank">&nbsp;</span>${escapeHtml(parts[1])}</div>
            <div class="ex-hint">${escapeHtml(ex.gloss)}</div>`;
  }
  html += `<div class="options">` + shuffle(ex.options).map((o) =>
    `<button class="opt-btn" data-val="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join("") + `</div>`;
  area.innerHTML = html;
  area.querySelectorAll(".opt-btn").forEach(b => b.addEventListener("click", () => {
    area.querySelectorAll(".opt-btn").forEach(x => x.classList.remove("selected"));
    b.classList.add("selected");
    session.selection = b.dataset.val;
    if (ex.type === "fill") document.getElementById("fill-blank").textContent = b.dataset.val;
    document.getElementById("btn-check").disabled = false;
  }));
}

function renderWords(area, ex) {
  area.innerHTML = `
    <div class="ex-prompt">${dirTag(ex)}${escapeHtml(ex.prompt)}</div>
    <div class="answer-area" id="answer-area"></div>
    <div class="wordbank" id="wordbank"></div>`;
  const bank = document.getElementById("wordbank");
  shuffle(ex.bank).forEach((w, i) => {
    const c = document.createElement("button");
    c.className = "word-chip";
    c.textContent = w;
    c.dataset.idx = i;
    c.addEventListener("click", () => {
      session.words.push({ w, idx: i });
      c.classList.add("used");
      drawAnswer();
      document.getElementById("btn-check").disabled = session.words.length === 0;
    });
    bank.appendChild(c);
  });
  function drawAnswer() {
    const aa = document.getElementById("answer-area");
    aa.innerHTML = "";
    session.words.forEach((item, pos) => {
      const c = document.createElement("button");
      c.className = "word-chip in-answer";
      c.textContent = item.w;
      c.addEventListener("click", () => {
        session.words.splice(pos, 1);
        bank.querySelector(`[data-idx="${item.idx}"]`).classList.remove("used");
        drawAnswer();
        document.getElementById("btn-check").disabled = session.words.length === 0;
      });
      aa.appendChild(c);
    });
  }
}

function renderListen(area, ex) {
  area.innerHTML = `
    <div class="ex-prompt">${escapeHtml(ex.prompt)}</div>
    <div class="listen-row">
      <button class="speaker-btn" id="btn-speak" title="Play audio">🔊</button>
      <input class="text-input" id="listen-input" type="text" placeholder="Type what you hear…" autocomplete="off">
    </div>
    ${ex.hint ? `<div class="ex-hint">Hint: ${escapeHtml(ex.hint)}</div>` : ""}`;
  const input = document.getElementById("listen-input");
  document.getElementById("btn-speak").addEventListener("click", () => speak(ex.answer));
  input.addEventListener("input", () => {
    session.typed = input.value;
    document.getElementById("btn-check").disabled = input.value.trim() === "";
  });
  setTimeout(() => speak(ex.answer), 350);
}

function renderMatch(area, ex) {
  area.innerHTML = `<div class="ex-prompt">${escapeHtml(ex.prompt)}</div><div class="match-grid" id="match-grid"></div>
    <div class="ex-hint" id="match-status">0 / ${ex.pairs.length} matched</div>`;
  const grid = document.getElementById("match-grid");
  const left = shuffle(ex.pairs.map((p, i) => ({ label: p[0], id: i })));
  const right = shuffle(ex.pairs.map((p, i) => ({ label: p[1], id: i })));
  const cells = shuffle([...left.map(c => ({ ...c, side: "L" })), ...right.map(c => ({ ...c, side: "R" }))]);
  cells.forEach(c => {
    const b = document.createElement("button");
    b.className = "match-btn";
    b.textContent = c.label;
    b.dataset.side = c.side;
    b.dataset.id = c.id;
    b.addEventListener("click", () => {
      if (session.matched.has(c.id) || b.classList.contains("selected")) return;
      if (session.matchSel) {
        const prev = grid.querySelector(`[data-side="${session.matchSel.side}"][data-id="${session.matchSel.id}"]`);
        if (prev) prev.classList.remove("selected");
      }
      if (session.matchSel && session.matchSel.side !== c.side) {
        if (session.matchSel.id === c.id) {
          session.matched.add(c.id);
          b.classList.add("matched");
          grid.querySelector(`[data-side="${session.matchSel.side}"][data-id="${c.id}"]`).classList.add("matched");
          session.matchSel = null;
          document.getElementById("match-status").textContent = `${session.matched.size} / ${ex.pairs.length} matched`;
          if (session.matched.size === ex.pairs.length) document.getElementById("btn-check").disabled = false;
        } else {
          session.matchSel = { side: c.side, id: c.id };
          b.classList.add("selected");
        }
      } else {
        session.matchSel = { side: c.side, id: c.id };
        b.classList.add("selected");
      }
    });
    grid.appendChild(b);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------------- Checking ---------------- */

function currentAnswer() {
  const ex = session.lesson.exercises[session.index];
  if (ex.type === "choice" || ex.type === "fill") return session.selection;
  if (ex.type === "words") return session.words.map(x => x.w).join(" ");
  if (ex.type === "listen") return session.typed;
  if (ex.type === "match") return session.matched.size === ex.pairs.length ? "__matched__" : "";
  return "";
}

function checkAnswer() {
  const ex = session.lesson.exercises[session.index];
  const given = currentAnswer();
  const ok = ex.type === "match" ? given === "__matched__" : normalize(given) === normalize(ex.answer);
  session.answered++;
  if (ok) {
    session.correct++;
    session.earned += 10;
    showResult(true, ex);
  } else {
    session.hearts--;
    document.getElementById("stat-hearts").textContent = session.hearts;
    showResult(false, ex);
    if (session.hearts <= 0) setTimeout(showFailed, 1400);
  }
  document.getElementById("progress-fill").style.width = ((session.index + 1) / session.lesson.exercises.length * 100) + "%";
}

function showResult(ok, ex) {
  const modal = document.getElementById("modal-result");
  const body = document.getElementById("modal-body");
  body.className = "modal-body " + (ok ? "good" : "bad");
  body.innerHTML = ok
    ? `<h1>Correct!</h1><p>+10 XP</p>`
    : `<h1>Not quite…</h1><p class="correct-answer">Correct answer: <b>${escapeHtml(ex.answer)}</b></p>`;
  modal.classList.remove("hidden");
}

function nextExercise() {
  document.getElementById("modal-result").classList.add("hidden");
  session.index++;
  if (session.index >= session.lesson.exercises.length) finishLesson();
  else renderExercise();
}

function finishLesson() {
  const id = session.lesson.id;
  state.completed[id] = Math.max(state.completed[id] || 0, session.earned);
  state.xp += session.earned;
  saveStore();
  if (window.SlovenkoCloud) window.SlovenkoCloud.sync();
  showScreen("screen-complete");
  document.getElementById("complete-xp").textContent = session.earned;
  const acc = session.answered ? Math.round(session.correct / session.answered * 100) : 100;
  document.getElementById("complete-acc").textContent = acc + "%";
  document.getElementById("complete-sub").textContent =
    `${session.lesson.title} — ${state.name} earned ${session.earned} XP!`;
  session = null;
}

function showFailed() {
  document.getElementById("modal-result").classList.add("hidden");
  document.getElementById("modal-failed").classList.remove("hidden");
}

/* ---------------- Wiring ---------------- */

document.getElementById("btn-check").addEventListener("click", checkAnswer);
document.getElementById("btn-modal-next").addEventListener("click", nextExercise);
document.getElementById("btn-continue").addEventListener("click", () => { renderHome(); showScreen("screen-home"); });
document.getElementById("btn-retry").addEventListener("click", () => {
  document.getElementById("modal-failed").classList.add("hidden");
  startLesson(session.lesson.id);
});
document.getElementById("btn-exit").addEventListener("click", () => {
  document.getElementById("modal-failed").classList.add("hidden");
  session = null;
  renderHome();
  showScreen("screen-home");
});
document.getElementById("btn-quit").addEventListener("click", () => {
  session = null;
  renderHome();
  showScreen("screen-home");
});
document.getElementById("btn-switch-profile").addEventListener("click", () => {
  session = null;
  renderProfiles();
  showScreen("screen-profiles");
});
document.getElementById("btn-add-profile").addEventListener("click", () => {
  document.getElementById("profile-create").classList.remove("hidden");
  document.getElementById("profile-name").focus();
});
document.getElementById("btn-create-profile").addEventListener("click", createProfile);
document.getElementById("profile-name").addEventListener("keydown", (e) => {
  if (e.key === "Enter") createProfile();
});

/* ---------------- Boot ---------------- */

if (state) { updateStreak(); renderHome(); showScreen("screen-home"); }
else { renderProfiles(); showScreen("screen-profiles"); }

</script>
</body>
</html>
